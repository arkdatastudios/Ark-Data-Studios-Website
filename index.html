<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARK DATA STUDIOS</title>
    <!-- jQuery Library -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- jQuery UI Library -->
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <!-- jQuery UI CSS (for styles) -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
    <style>
        /* General styles */
        body, html {
            margin: 0;
            padding: 0;
            font-family: monospace;
            box-sizing: border-box;
        }

        /* Header styling */
        header {
            display: flex;
            justify-content: space-between;
            padding: 20px 10%;
            background-color: #F3CFC6;
            color: #F9A995;
            box-sizing: border-box;
        }

        header a {
            color: #F9A995;
            text-decoration: none;
            padding: 10px;
            font-size: 1.5em;
        }

        .space-buffer {
            height: 20px;
        }

        /* Portals (images) */
        .portals {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            flex-wrap: wrap;
        }

        .portal-1, .portal-2, .portal-3 {
            flex: 1 1 100%; /* Default to full width on small screens */
            display: flex;
            justify-content: center;
        }

        .pics {
            width: 100%;
            height: auto;
            max-width: 300px; /* Limit max size of images */
        }

        /* Social links styling */
        .socials {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            flex-wrap: wrap;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .portal-1, .portal-2, .portal-3 {
                flex: 1 1 100%; /* Stack the portals vertically */
                justify-content: center;
                margin-bottom: 20px;
            }
        }

        @media (max-width: 480px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            header a {
                font-size: 1.5em;
            }

            .socials {
                flex-direction: column;
                align-items: center;
            }

            .space-buffer {
                height: 10px;
            }
        }
    </style>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="media/23-100.png">
</head>
<body>
    <!-- Header: Navigation bar at the top of the screen -->
    <section>
        <header>
            <a class="inspo" href="https://www.pinupmagazine.org/articles/dave-free-interview" target="_blank">Inspo</a>
            <a class="contact" href="https://noahpitts.studio/contact/" target="_blank">Contact</a>
        </header>
        <div class="space-buffer"></div>
    </section>

    <!-- The portals (draggable art that leads to the pages for my projects) -->
    <div class="portals">
        <section>
            <div class="portal-1">
                <span>
                    <a href="./at-service.html">
                        <img draggable="false" src="/media/1-100.png" class="pics" alt="The First Logo">
                    </a>
                </span>
            </div>

            <div class="portal-2">
                <span>
                    <a href="./company.html">
                        <img draggable="false" src="/media/10-100.png" class="pics" alt="The Tenth Logo">
                    </a>
                </span>
            </div>

            <div class="portal-3">
                <span>
                    <a href="./work.html">
                        <img draggable="false" src="/media/11-100.png" class="pics" alt="The Eleventh Logo">
                    </a>
                </span>
            </div>
        </section>
    </div>

    <!-- Section: Social Media Links -->
    <section>
        <div class="socials">
            <a href="https://www.instagram.com/arkdatastudios/" target="_blank" rel="noreferrer">Instagram</a>
            <a>/</a>
            <a href="https://www.linkedin.com/company/arkdatastudios" target="_blank" rel="noreferrer">LinkedIn</a>
            <a>/</a>
            <a href="https://medium.com/@arkdatastudios" target="_blank" rel="noreferrer">Medium</a>
            <a>/</a>
            <a href="https://www.youtube.com/@ArkDataStudios" target="_blank" rel="noreferrer">YouTube</a>
        </div>
    </section>

    <!-- JavaScript for the page interaction -->
    <script src="/js/homepage.js"></script>

</body>
</html>
